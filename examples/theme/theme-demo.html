<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multiple Themes Example</title>
  <link rel="preload" href="../../dist/litecss.min.css" as="style" />
  <link rel="stylesheet" href="../../dist/litecss.min.css" />

</head>
<body class="theme-light">
  <h1>Hello Theme Switcher</h1>
  <button id="toggleTheme" class="btn--success">Toggle Theme</button>
  <div id="themeControls">
    <button class="btn--secondary" data-theme="nord">Nord Theme</button>
    <button class="btn--secondary" data-theme="monokai">Monokai Theme</button>
    <button class="btn--secondary" data-theme="palenight">Palenight Theme</button>
    <button class="btn--secondary" data-theme="material">Material Theme</button>
    <button class="btn--secondary" data-theme="gruvbox">Gruvbox Theme</button>
    <button class="btn--secondary" data-theme="ayu">Ayu Theme</button>
    <button class="btn--secondary" data-theme="one-dark">One Dark Theme</button>
    <button class="btn--secondary" data-theme="zenburn">Zenburn Theme</button>
    <button class="btn--secondary" data-theme="github">GitHub Theme</button>
    <button class="btn--secondary" data-theme="base16">Base16 Theme</button>
    <button class="btn--secondary" data-theme="cobalt2">Cobalt2 Theme</button>
    <button class="btn--secondary" data-theme="night-owl">Night Owl Theme</button>
    <button class="btn--secondary" data-theme="verminal">Verminal Theme</button>
    <button class="btn--secondary" data-theme="spacemacs">Spacemacs Theme</button>
  </div>
    <script src="theme.js" defer></script>
</body>
</html>
